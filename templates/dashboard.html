<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Explainability Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
}

.card-custom {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 15px;
}

pre {
  background: black;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container py-4">

<h2>🧠 AI Explainability Dashboard</h2>

<div class="row g-4">

<!-- INPUT -->
<div class="col-md-4">
<div class="card-custom">
<h5>Input</h5>

<input id="pm25" class="form-control mb-2" placeholder="PM2.5">
<input id="pm10" class="form-control mb-2" placeholder="PM10">
<input id="no2" class="form-control mb-2" placeholder="NO2">
<input id="so2" class="form-control mb-2" placeholder="SO2">
<input id="o3" class="form-control mb-2" placeholder="O3">
<input id="temperature" class="form-control mb-2" placeholder="Temperature">
<input id="humidity" class="form-control mb-2" placeholder="Humidity">
<input id="windspeed" class="form-control mb-2" placeholder="WindSpeed">

<button class="btn btn-primary mt-2" onclick="runExplain()">Explain</button>
</div>
</div>

</div>
<div id="output" style="margin-top:20px;"></div>
<div class="row mt-4">

</div>

</div>

<div id="output"></div>
<script>
function runExplain() {

  const data = {
    pm25: document.getElementById("pm25").value || 0,
    pm10: document.getElementById("pm10").value || 0,
    no2: document.getElementById("no2").value || 0,
    so2: document.getElementById("so2").value || 0,
    o3: document.getElementById("o3").value || 0,
    temperature: document.getElementById("temperature").value || 0,
    humidity: document.getElementById("humidity").value || 0,
    windspeed: document.getElementById("windspeed").value || 0,
    age: 30,
    gender: "male",
    smoker: "none",
    income: "medium",
    indoor_pollution: false,
    family_history: false
  };

  fetch("/explain", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(d => {

    let html = "";

    html += "<h4>Normalized Inputs</h4>";
    html += "<pre>" + JSON.stringify(d.normalized_inputs, null, 2) + "</pre>";

    html += "<h4>Weighted Contributions</h4>";
    for (let disease in d.contributions) {
      html += `<h5>${disease}</h5>`;
      html += "<pre>" + JSON.stringify(d.contributions[disease], null, 2) + "</pre>";
    }

    html += "<h4>Base Predictions</h4>";
    html += "<pre>" + JSON.stringify(d.base_probs, null, 2) + "</pre>";

    html += "<h4>Final Predictions</h4>";
    html += "<pre>" + JSON.stringify(d.final_probs, null, 2) + "</pre>";

    html += "<h4>Multiplier Details</h4>";
    html += "<pre>" + JSON.stringify(d.personal_details, null, 2) + "</pre>";

    document.getElementById("output").innerHTML = html;
  });
}
</script>

</body>
</html>
